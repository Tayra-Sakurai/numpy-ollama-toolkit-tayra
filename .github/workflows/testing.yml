name: Execute PyTest
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - .github/workflows/testing.yml

permissions:
  contents: read

jobs:
  test:
    name: Test Python
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Execute tests
        run: hatch test --all
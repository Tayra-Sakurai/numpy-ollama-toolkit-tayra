name: Execute PyTest
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - pyproject.toml

permissions:
  contents: read

jobs:
  test:
    name: Test Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Execute tests
        run: hatch test --all